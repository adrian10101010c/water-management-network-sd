<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>WaterManagement - Panel Central</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 24px;
        }
        h1 {
            color: #38bdf8;
            border-bottom: 2px solid #1e293b;
            padding-bottom: 12px;
            margin-bottom: 24px;
        }
        .grid{
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }
        .card{
            background-color: #1e293b;
            border-radius: 8px;
            padding: 16px;
            border-left: 8px solid #64748b;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .station-id {
            font-size: 1.25rem;
            font-weight: bold;
        }
        .badge {
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .status-AVAILABLE {
            border-left-color: #22c55e;
        }
        .status-AVAILABLE .badge {
            background-color: #22c55e;
            color: #052e16;
        }
        .status-WATERING {
            border-left-color: #22c55e;
        }
        .status-WATERING .badge {
            background-color: #22c55e;
            color: #052e16;
            animation: blink 1s infinite alternate;
        }
        .status-LEAK {
            border-left-color: #ef4444;
        }
        .status-LEAK .badge {
            background-color: #ef4444;
            color: #450a0a;
        }
        .status-OUT_OF_SERVICE {
            border-left-color: #f97316;
        }
        .status-OUT_OF_SERVICE .badge {
            background-color: #f97316;
            color: #0f172a;
        }
        .status-DISCONNECTED {
            border-left-color: #64748b;
        }
        .status-DISCONNECTED .badge {
            background-color: #64748b;
            color: #0f172a;
        }
        @keyframes blink {
            from { opacity: 1;}
            to { opacity: 0.3;}
        }
        .telemetry-row {
            display: flex;
            justify-content: space-between;
            margin: 6px 0;
            font-size: 0.95rem;
            color: #cbd5e1;
        }
        .value {
            font-weight: bold;
            color: #f8fafc;
        }
    </style>
</head>
<body>
    <h1>WaterManagement - Panel de control</h1>
    <div id="stations-grid" class="grid">

    </div>
    <script>
        async function sendAction(wsId, action, value = null) {
            try {
                let bodyData = { ws_id: wsId, action: action };
                if (action === 'START') bodyData.duration = parseInt(value) || 60;
                if (action === 'SET_FLOW') bodyData.flow = parseFloat(value) || 10.0;
                const res = await fetch('/api/action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bodyData)
                });
                const data = await res.json();
                alert(data.msg);
                fetchStations();
            } catch (err) {
                alert("Error al enviar la acción");
            }
        }
        async function fetchStations() {
            try {
                const res = await fetch('/api/stations');
                const data = await res.json();
                const container = document.getElementById('stations-grid');
                container.innerHTML = '';

                data.forEach(ws => {
                    const statusClass = `status-${ws.status}`;
                    const statusLabel = ws.status === 'OUT_OF_SERVICE' ? 'OUT OF SERVICE' : ws.status;
                    
                    const card = document.createElement('div');
                    card.className = `card ${statusClass}`;
                    card.innerHTML = `
                        <div class="card-header">
                            <span class="station-id">${ws.id}</span>
                            <span class="badge">${statusLabel}</span>
                        </div>
                        <div class="telemetry-row">
                            <span>Ubicación:</span><span class="value">${ws.location}</span>
                        </div>
                        <div class="telemetry-row">
                            <span>Caudal:</span><span class="value">${ws.flow} L/min</span>
                        </div>
                        <div class="telemetry-row">
                            <span>Total acumulado:</span><span class="value">${ws.accumulated_volume} L</span>
                        </div>
                        <div class="telemetry-row">
                            <span>Operario:</span><span class="value">${ws.operator ? ws.operator : 'Ninguno'}</span>
                        </div>
                        <hr style="border-color: #334155; margin: 12px 0;">
                        <div style="display: flex; gap: 5px; margin-bottom: 8px;">
                            <input type="number" id="dur-${ws.id}" value="10" min="1" style="width: 50px; background: #334155; color: white; border: none; border-radius: 4px; padding: 4px;">
                            <button onclick="sendAction('${ws.id}', 'START', document.getElementById('dur-${ws.id}').value)" style="background: #22c55e; color: white; border: none; border-radius: 4px; padding: 4px 8px; cursor: pointer; flex-grow: 1;">Regar (s)</button>
                            <button onclick="sendAction('${ws.id}', 'STOP')" style="background: #ef4444; color: white; border: none; border-radius: 4px; padding: 4px 8px; cursor: pointer;">Bloquear</button>
                            <button onclick="sendAction('${ws.id}', 'ACTIVATE')" style="background: #38bdf8; color: white; border: none; border-radius: 4px; padding: 4px 8px; cursor: pointer;">Activar</button>
                        </div>
                        <div style="display: flex; gap: 5px;">
                            <input type="number" id="flow-${ws.id}" value="5" min="1" step="0.5" style="width: 50px; background: #334155; color: white; border: none; border-radius: 4px; padding: 4px;">
                            <button onclick="sendAction('${ws.id}', 'SET_FLOW', document.getElementById('flow-${ws.id}').value)" style="background: #a855f7; color: white; border: none; border-radius: 4px; padding: 4px 8px; cursor: pointer; flex-grow: 1;">Fijar Caudal (L/min)</button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error("Error al actualizar panel:", err);
            }
        }
        setInterval(fetchStations, 1000);
        fetchStations();
    </script>
</body>


</html>
